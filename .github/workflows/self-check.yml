# CI for the CI.
#
# The reusable workflow cannot run against this repository — there is no package
# here to build, test or publish — so the parts of it that *can* be checked are
# checked directly: the TypeScript the jobs execute, and the YAML that wires them
# together.
#
# This exists because moving the job bodies out of bash only pays off if the
# TypeScript is actually typechecked. Otherwise it trades one kind of silent
# failure for another, discovered in whichever of the seven repositories runs
# next.

name: Self-check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: self-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # tsx strips types rather than checking them, so nothing in scripts/ci/ is
  # verified at run time. `tsc --noEmit` is the only thing standing between a
  # typo here and a red build in one of the seven package repositories.
  scripts:
    name: typecheck CI scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The floor of the matrix these scripts run on in the package repos.
          node-version: '22'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      # actionlint reads .github/workflows/ only — it does not validate composite
      # `action.yml` files, so a malformed wrapper would otherwise surface for the
      # first time in whichever package repository ran CI next. Parsing is a low
      # bar, but it is the bar that catches a bad edit.
      - name: Parse the wrapper action
        run: pnpm dlx js-yaml@4.1.0 actions/run-ci-script/action.yml > /dev/null

      # Same bar, same reason, for the rulesets and the tselect config: nothing
      # in this repository consumes them at run time, so a malformed file would
      # first be seen as a 422 from the middle of a `tselect sync --apply`, with
      # some repos already changed.
      #
      # `tselect check` rather than a `node --eval` block here on purpose: it
      # runs the CLI's own loaders, so the rules cannot drift apart from the code
      # they exist to protect. A validator that accepts a file the tool then
      # rejects is worse than no validator.
      - name: Validate the tselect config
        run: pnpm run tselect check

      # The environments are applied by piping them into `gh api`, so a bad file
      # surfaces as a 422 with no line number. This also catches the placeholder
      # reviewer id — the one field that has to be edited before the file is worth
      # applying, and the one nothing else would object to, since `"id": 0` is
      # valid JSON and a reviewer who does not exist.
      - name: Parse the environments
        run: |
          node --eval '
            const fs = require("node:fs")
            for (const f of fs.readdirSync("environments").filter((n) => n.endsWith(".json"))) {
              const path = "environments/" + f
              const e = JSON.parse(fs.readFileSync(path, "utf8"))
              if (!Array.isArray(e.reviewers) || e.reviewers.length === 0) {
                throw new Error(path + ": no reviewers, which is the whole point")
              }
              for (const r of e.reviewers) {
                if (r.type !== "User" && r.type !== "Team") {
                  throw new Error(path + ": reviewer type must be User or Team")
                }
              }
            }
          '

  workflows:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # shellcheck over every `run:` block, plus expression syntax and `uses:`
      # references. Covers .github/workflows/ only; the wrapper action is parsed
      # in the job above.
      #
      # Pinned by image digest rather than tag, for the same reason every
      # `uses:` in ci.yml is pinned to a commit SHA.
      - name: Lint workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color
