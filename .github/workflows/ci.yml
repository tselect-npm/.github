# Reusable CI for every @tselect package.
#
#   uses: tselect-npm/.github/.github/workflows/ci.yml@v1
#
# Callers MUST pin a tag. Never `@main` — an edit here would otherwise change all
# seven repos' CI at once. See the README for the caller template and inputs.
#
# What each job *does* lives in `scripts/ci/<job>.ts`, not here. This file is the
# wiring: the matrix, the inputs, and the marketplace actions that have to be
# steps (checkout, Coveralls, artifact upload). Everything else is TypeScript,
# where it can be read and typechecked as code rather than as YAML-quoted bash.
#
# `actions/run-ci-script` provisions Node + pnpm and runs one of those scripts.
# It is referenced at an **immutable** `@vX.Y.Z` tag, not at `@v1`, and the
# reference is bumped in the same commit that is then tagged with that version.
#
# Two things were measured before settling on that, both against a real runner:
#
#   * `@v1` does not work. The ref is resolved independently of the tag the
#     caller used for this workflow, so a scratch tag testing a change to the
#     wrapper still loads the wrapper from wherever `v1` points — the old commit:
#     "Can't find 'action.yml' … for action 'tselect-npm/.github/…@v1'".
#   * `./actions/run-ci-script` does not work either. Inside a reusable workflow
#     a relative ref resolves against the *caller's* workspace, not this
#     repository: "Can't find 'action.yml' … under
#     '/home/runner/work/url/url/actions/run-ci-script'".
#
# An immutable version tag is the only form that lets a change be run before it
# is released: tag the branch, and both the workflow and the wrapper resolve to
# it. The cost is that the version here has to be bumped for every change to the
# action — deliberately, since that is what makes the pairing reviewable.
# The README's "Releasing a change" section is the procedure.
#
# Every marketplace action is pinned to a commit SHA (the tag is in the trailing
# comment) so a moved tag upstream cannot silently change what runs in seven
# repos. Dependabot keeps the pins current, here and in the wrapper action.

name: CI

on:
  workflow_call:
    inputs:
      # --- matrix -------------------------------------------------------------
      node-versions:
        description: 'JSON array of Node versions to test. Default is every line still receiving security support: 22 (maintenance LTS), 24 (active LTS), 26 (current). The lowest entry is also every package''s declared engines.node floor, so the floor is tested by construction.'
        type: string
        default: '["22", "24", "26"]'
      primary-node-version:
        description: 'The version that runs the static checks and uploads coverage. Must be one of node-versions.'
        type: string
        default: '24'
      runs-on:
        description: 'Runner label.'
        type: string
        default: ubuntu-latest

      # --- scripts (set to '' to skip the step) -------------------------------
      # These name package.json scripts, not commands, so a repo mid-migration
      # can opt out of a check it does not have yet.
      typecheck-script:
        description: "package.json script for typechecking. '' skips it."
        type: string
        default: typecheck
      lint-script:
        description: "package.json script for linting (Biome's `check` covers formatting too). '' skips it."
        type: string
        default: lint
      coverage-script:
        description: "package.json script that runs the tests with coverage. Runs on every matrix entry. '' falls back to test-script."
        type: string
        default: cov
      test-script:
        description: 'package.json script that runs the tests without coverage. Only used when coverage-script is empty.'
        type: string
        default: test
      build-script:
        description: "package.json script that builds the publishable output. '' skips the build job entirely."
        type: string
        default: build

      # --- install ------------------------------------------------------------
      install-command:
        description: 'Dependency install command. pnpm is provisioned from the packageManager field.'
        type: string
        default: pnpm install --frozen-lockfile
      cache:
        description: "Package manager whose store actions/setup-node caches. Set to '' for a repo with no pnpm-lock.yaml yet, where `cache: pnpm` fails outright."
        type: string
        default: pnpm

      # --- coverage -----------------------------------------------------------
      coverage-lcov:
        description: 'Path to the lcov report produced by coverage-script.'
        type: string
        default: coverage/lcov.info
      upload-coverage:
        description: 'Send lcov to Coveralls (badge + PR comment). Skipped automatically for pull requests from forks, which have a read-only token.'
        type: boolean
        default: true

      # --- publishable-artifact gates ----------------------------------------
      dist-dir:
        description: 'Directory the build writes to.'
        type: string
        default: dist
      es-check-target:
        description: "ECMAScript version the built output must not exceed. This is the support policy's emitted-syntax ceiling, asserted by parsing rather than grepping. '' skips the check."
        type: string
        default: es2015
      check-types-resolution:
        description: 'Run @arethetypeswrong/cli against the packed tarball (validates the exports map and dual-package type resolution).'
        type: boolean
        default: true
      attw-profile:
        description: "@arethetypeswrong/cli profile: node16 (its default; ignores node10 resolution), strict (ignores nothing) or esm-only."
        type: string
        default: node16
      upload-package:
        description: 'Keep the packed tarball as a workflow artifact. Useful while publishing is still manual.'
        type: boolean
        default: true

      # --- audit --------------------------------------------------------------
      audit:
        description: 'Run pnpm audit.'
        type: boolean
        default: true
      audit-level:
        description: 'Minimum severity that counts: low | moderate | high | critical.'
        type: string
        default: low
      audit-blocking:
        description: 'Fail the build on audit findings. Set false for repos that have not finished migrating off the old mocha/nyc tree yet.'
        type: boolean
        default: true

      # --- pinned tool versions ----------------------------------------------
      es-check-version:
        type: string
        default: '9.6.4'
      attw-version:
        type: string
        default: '0.18.5'
      tsx-version:
        description: 'tsx version used to run the CI scripts. Pinned so a job cannot change behaviour without a commit here.'
        type: string
        default: '4.23.12'

permissions:
  contents: read

# No `concurrency` here on purpose. Inside a reusable workflow `github.workflow`
# and `github.ref` resolve to the *caller's*, so two caller jobs pointing at this
# file land in the same group and cancel each other. Cancellation policy belongs
# to the caller — the README's template sets it there.

jobs:
  # Tests run on every supported Node line — this is what turns "we support 22
  # through 26" from an assertion into something proven. Coverage runs on all of
  # them (the thresholds are part of the gate); only the primary one uploads.
  #
  # → scripts/ci/test.ts
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ${{ inputs.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(inputs.node-versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: tselect-npm/.github/actions/run-ci-script@v1.1.0
        with:
          script: test.ts
          node-version: ${{ matrix.node }}
          install: ${{ inputs.install-command }}
          cache: ${{ inputs.cache }}
          tsx-version: ${{ inputs.tsx-version }}
          inputs: ${{ toJSON(inputs) }}

      # Coveralls authenticates with the built-in GITHUB_TOKEN, so no secret has
      # to be provisioned in any of the seven repos. Fork PRs get a read-only
      # token, so the upload is skipped rather than failed there.
      - name: Upload coverage to Coveralls
        if: >-
          inputs.upload-coverage
          && matrix.node == inputs.primary-node-version
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository)
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: ${{ inputs.coverage-lcov }}
          format: lcov
          fail-on-error: false

  # Typecheck and lint share one job: these packages are small enough that a
  # second runner costs more in setup than it saves in wall-clock. The script
  # runs both even when the first fails, so one push surfaces every problem
  # instead of one per round-trip.
  #
  # → scripts/ci/static.ts
  static:
    name: typecheck + lint
    if: inputs.typecheck-script != '' || inputs.lint-script != ''
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: tselect-npm/.github/actions/run-ci-script@v1.1.0
        with:
          script: static.ts
          node-version: ${{ inputs.primary-node-version }}
          install: ${{ inputs.install-command }}
          cache: ${{ inputs.cache }}
          tsx-version: ${{ inputs.tsx-version }}
          inputs: ${{ toJSON(inputs) }}

  # Builds, then distrusts the build's exit code: asserts the emitted files, the
  # emitted syntax level, the packed tarball's contents, and that a consumer can
  # resolve the types. A build tool can report success and still drop
  # declarations, and both of those have happened here.
  #
  # → scripts/ci/build.ts
  build:
    name: build + package
    if: inputs.build-script != ''
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: tselect-npm/.github/actions/run-ci-script@v1.1.0
        id: build
        with:
          script: build.ts
          node-version: ${{ inputs.primary-node-version }}
          install: ${{ inputs.install-command }}
          cache: ${{ inputs.cache }}
          tsx-version: ${{ inputs.tsx-version }}
          inputs: ${{ toJSON(inputs) }}

      # Deliberately not gated on the build step succeeding: the tarball is most
      # worth having when a later gate rejected it. The script reports whether
      # one was produced, so this is skipped rather than failed when packing
      # never happened.
      - name: Upload the tarball
        if: >-
          ${{ !cancelled()
              && inputs.upload-package
              && fromJSON(steps.build.outputs.result || '{}').packed }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-tarball
          path: ${{ fromJSON(steps.build.outputs.result || '{}').tarball }}
          retention-days: 7
          if-no-files-found: error

  # Zero vulnerabilities is a standing requirement; this is what makes it a gate
  # rather than something remembered. No install needed — pnpm audits the
  # lockfile.
  #
  # → scripts/ci/audit.ts
  audit:
    name: audit
    if: inputs.audit
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: tselect-npm/.github/actions/run-ci-script@v1.1.0
        with:
          script: audit.ts
          node-version: ${{ inputs.primary-node-version }}
          cache: ${{ inputs.cache }}
          tsx-version: ${{ inputs.tsx-version }}
          inputs: ${{ toJSON(inputs) }}

  # One stable check name for branch protection. Matrix job names change whenever
  # node-versions changes; this one does not, so the seven repos can require
  # "CI / ci" and never touch their settings again.
  #
  # → scripts/ci/aggregate.ts
  ci:
    name: ci
    if: ${{ always() }}
    needs: [test, static, build, audit]
    runs-on: ${{ inputs.runs-on }}
    steps:
      # This job only reads the `needs` context, but it still checks out and
      # provisions pnpm so that it goes through the same wrapper as every other
      # job. Leaving one job in bash would cost more in "why is this one
      # different?" than the ~20s of setup it saves.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: tselect-npm/.github/actions/run-ci-script@v1.1.0
        with:
          script: aggregate.ts
          node-version: ${{ inputs.primary-node-version }}
          cache: ${{ inputs.cache }}
          tsx-version: ${{ inputs.tsx-version }}
          inputs: ${{ toJSON(inputs) }}
          needs: ${{ toJSON(needs) }}
